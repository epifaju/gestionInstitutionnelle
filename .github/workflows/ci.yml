name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend (Node + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke (optional)
    # Activer via variable de dépôt RUN_E2E=true + secrets E2E_BASE_URL / E2E_*_EMAIL / E2E_*_PASSWORD
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_FINANCIER_EMAIL: ${{ secrets.E2E_FINANCIER_EMAIL }}
          E2E_FINANCIER_PASSWORD: ${{ secrets.E2E_FINANCIER_PASSWORD }}
          E2E_RH_EMAIL: ${{ secrets.E2E_RH_EMAIL }}
          E2E_RH_PASSWORD: ${{ secrets.E2E_RH_PASSWORD }}
          E2E_LOGISTIQUE_EMAIL: ${{ secrets.E2E_LOGISTIQUE_EMAIL }}
          E2E_LOGISTIQUE_PASSWORD: ${{ secrets.E2E_LOGISTIQUE_PASSWORD }}
          E2E_EMPLOYE_EMAIL: ${{ secrets.E2E_EMPLOYE_EMAIL }}
          E2E_EMPLOYE_PASSWORD: ${{ secrets.E2E_EMPLOYE_PASSWORD }}
        run: npx playwright test

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gestion-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t gestion-frontend:ci ./frontend

      - name: Trivy scan (repo filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gestion-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gestion-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
